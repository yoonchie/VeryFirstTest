 plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'com.codeborne:selenide:7.18.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'//нейронка пишет что с 9 версии грэдла без этого нельзя
}

test {
    useJUnitPlatform()
}